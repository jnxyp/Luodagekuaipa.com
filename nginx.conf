server {
    listen 80;
    server_name luodagekuaipa.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /9150e4e5gy1g96h7d6fk6j20f00f0gm0.jpg {
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
