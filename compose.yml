name: luodagekuaipa
services:
  website:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    ports:
      - "127.0.0.1:${PORT:-18087}:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./9150e4e5gy1g96h7d6fk6j20f00f0gm0.jpg:/usr/share/nginx/html/9150e4e5gy1g96h7d6fk6j20f00f0gm0.jpg:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
